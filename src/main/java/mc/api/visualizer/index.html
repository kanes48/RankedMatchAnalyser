<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Speedrun Visualizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
    <header>
        <div>
            <h1>Speedrun Visualizer</h1>
            <p>100-run progression · JSON driven</p>
        </div>
        <div class="header-stats">
            <div><span>RUN</span><strong id="runNumber">—</strong></div>
            <div><span>TIME</span><strong id="currentTime">—</strong></div>
            <div><span>PB</span><strong id="personalBest">—</strong></div>
        </div>
    </header>

    <section class="stage">
        <div class="stage-top">
            <div>
                <span class="eyebrow" id="phase">READY</span>
                <h2 id="stageTitle">Run progression</h2>
            </div>
            <div class="controls">
                <button id="playButton">▶ Play</button>
                <button id="resetButton">↺ Reset</button>
            </div>
        </div>

        <div class="chart-wrap">
            <svg id="chart" viewBox="0 0 1600 760" role="img"
                 aria-label="Animated speedrun time chart"></svg>
        </div>

        <div class="timeline">
            <input id="timeline" type="range" min="0" max="0" value="0">
        </div>
    </section>

    <section class="distribution" id="distribution">
        <div class="section-heading">
            <div>
                <span class="eyebrow">DISTRIBUTION</span>
                <h2>Where did the runs cluster?</h2>
            </div>
            <span id="distributionSummary"></span>
        </div>
        <svg id="histogram" viewBox="0 0 1600 500"
             role="img" aria-label="Speedrun time distribution"></svg>
    </section>

    <section class="data-section">
        <details>
            <summary>Data</summary>
            <p>
                This page loads <code>runs.json</code> from the same folder.
                Replace that file with the JSON generated by your Java program.
            </p>
            <pre id="dataPreview"></pre>
        </details>
    </section>
</main>

<script src="animation.js"></script>
</body>
</html>
